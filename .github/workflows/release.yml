# The release of prebuilt archives: pushing a version tag runs ci.yml, then builds the archives on
# each system, and creates the GitHub release with them. This file holds all of the project's
# releasing; what is marked Per project is this project's own. By hand: the same build commands,
# then gh release create with the archives.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Whether the tag is a pre-release: one that ends in -alpha, -beta, -rc, -pre, -preview or -dev,
  # with or without a number after it (v1.2.0-rc.1, v1.2.0-rc1; in a sidestream fork
  # v0.8.2-mod.2-rc.1, while v0.8.2-mod.2 is a release). A pre-release is built as a release is and gets a GitHub pre-release with its files,
  # to download and try: it goes to no registry or package repository, and starts no other workflow.
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - id: kind
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eq -- '-(alpha|beta|rc|pre|preview|dev)\.?[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds the archives from the tag, with neither a secret nor a token that can write: building runs
  # the project's code and its dependencies'.
  build:
    needs: kind
    strategy:
      matrix:
        # Per project: the systems the release ships for, each with the name its archive carries.
        include:
          # zig builds every target's archive on this one runner.
          - os: ubuntu-24.04
            name: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Per project: the steps that build the program from the tag and put it, with its license
      # texts, into dist/ as one archive per system, named <project>-<version>-<name>, the version
      # being the tag without its v.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # What is published is built from scratch, not from a cache another run wrote.
          use-cache: false
      - name: Check that the tag matches build.zig.zon
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.kind.outputs.prerelease }}
        run: |
          version=$(sed -nE 's/^ *\.version = "(.*)",$/\1/p' build.zig.zon)
          # A pre-release keeps the version of the release it leads to.
          if [ "$PRERELEASE" != true ] && [ "v$version" != "$TAG" ]; then
            echo "tag $TAG doesn't match version $version" >&2
            exit 1
          fi
      # No ci.yml: the fork's tests run here, before anything is built for release.
      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux-musl
      # A pre-release is built with the tag's version, which .github/scripts/release-version.py
      # writes into this checkout alone: the repository's manifest keeps the version of the release
      # the pre-release leads to. For a release RELEASE_VERSION is empty and nothing is changed.
      - name: Give a pre-release the tag's version
        env:
          RELEASE_VERSION: ${{ needs.kind.outputs.prerelease == 'true' && github.ref_name || '' }}
        run: python3 .github/scripts/release-version.py
      - name: Build and pack
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          zig build release
          mkdir -p dist
          cp zig-out/dist/* dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Creates the release from the archives build made, and runs none of the project's code.
  github-release:
    needs: [kind, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.kind.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes --prerelease="$PRERELEASE"

  # Asks q0wkp/pkgs to package this release, which nothing else does: its Sync workflow has no
  # schedule. The token is a fine-grained one of q0wkp's, for q0wkp/pkgs only, with Actions read and
  # write: it can start the workflow but not change the repository. Without it this job fails, so the
  # failed run's mail says the release is waiting.
  pkgs:
    # After the job that creates the release, which this one reads. Not for a pre-release.
    needs: [kind, github-release]
    if: needs.kind.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask q0wkp/pkgs to package the release
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PKGS_DISPATCH_TOKEN is not set: q0wkp/pkgs won't package this release until its Sync workflow is run by hand"
            exit 1
          fi
          gh workflow run sync.yml -R q0wkp/pkgs -f packages="zmx"
