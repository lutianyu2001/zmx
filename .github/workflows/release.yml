# The release of prebuilt archives: pushing a version tag runs ci.yml, then builds the archives on
# each system, and creates the GitHub release with them. This file holds all of the project's
# releasing; what is marked Per project is this project's own. By hand: the same build commands,
# then gh release create with the archives.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Builds the archives from the tag, with neither a secret nor a token that can write: building runs
  # the project's code and its dependencies'.
  build:
    strategy:
      matrix:
        # Per project: the systems the release ships for, each with the name its archive carries.
        include:
          # zig builds every target's archive on this one runner.
          - os: ubuntu-24.04
            name: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Per project: the steps that build the program from the tag and put it, with its license
      # texts, into dist/ as one archive per system, named <project>-<tag>-<name>.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # What is published is built from scratch, not from a cache another run wrote.
          use-cache: false
      - name: Check that the tag matches build.zig.zon
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/^ *\.version = "(.*)",$/\1/p' build.zig.zon)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG doesn't match version $version" >&2
            exit 1
          fi
      # No ci.yml: the fork's tests run here, before anything is built for release.
      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux-musl
      - name: Build and pack
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          zig build release
          mkdir -p dist
          cp zig-out/dist/* dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Creates the release from the archives build made, and runs none of the project's code.
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  # Asks q0wkp/pkgs to package this release, which nothing else does: its Sync workflow has no
  # schedule. The token is a fine-grained one of q0wkp's, for q0wkp/pkgs only, with Actions read and
  # write: it can start the workflow but not change the repository. Without it this job fails, so the
  # failed run's mail says the release is waiting.
  pkgs:
    # After the job that creates the release, which this one reads.
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask q0wkp/pkgs to package the release
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PKGS_DISPATCH_TOKEN is not set: q0wkp/pkgs won't package this release until its Sync workflow is run by hand"
            exit 1
          fi
          gh workflow run sync.yml -R q0wkp/pkgs -f packages="zmx"
