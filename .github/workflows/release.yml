name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Builds the release with neither a secret nor a token that can write: the build runs the
  # project's code and its dependencies'.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # What is published is built from scratch, not from a cache another run wrote.
          use-cache: false

      - name: Check that the tag matches build.zig.zon
        run: |
          version=$(sed -nE 's/^ *\.version = "(.*)",$/\1/p' build.zig.zon)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match version $version" >&2
            exit 1
          fi

      - name: Run unit tests
        run: zig build test -Dtarget=x86_64-linux-musl

      - name: Build release binaries
        run: zig build release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: zig-out/dist/
          if-no-files-found: error

  # Publishes the release from what build built, and runs none of the project's code.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes

  # Asks q0wkp/pkgs to package this release now, rather than on its daily run. The token is a
  # fine-grained one of q0wkp's, for q0wkp/pkgs only, with Actions read and write: it can start the
  # workflow but not change the repository. Without it this job does nothing.
  pkgs:
    # The job that creates the release. Without one in this workflow, run it on the release's
    # publication instead (on: release: types: [published]) and drop this line.
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ask q0wkp/pkgs to package the release
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PKGS_DISPATCH_TOKEN is not set: q0wkp/pkgs picks the release up on its daily run"
            exit 0
          fi
          gh workflow run sync.yml -R q0wkp/pkgs -f packages="zmx"
