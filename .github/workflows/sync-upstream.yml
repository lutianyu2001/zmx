# Keeps the fork current with the project it was forked from, once a day: fast-forwards the branch
# upstream to the parent's default branch, opens a pull request from it into the default branch
# with a summary and a review that DeepSeek writes from the diff, and merges it when nothing
# conflicts. With conflicts the pull request stays open and the run fails, which is how its owner
# hears of it; the later runs sync nothing and only warn, until someone resolves them.
# .github/scripts/sync_upstream.py does all of it, and its header says how; by hand, the same
# script, with --dry-run to see what it would do.
#
# Each run also tells a check on healthchecks.io, whose ping URL is the secret
# SYNC_UPSTREAM_HEALTHCHECK_URL, that it ran or failed, so a day without a run (GitHub turns off a
# public repository's scheduled workflows after 60 days without activity) raises an alert, as a
# failed one does. The README's badge reads the outcome ("up-to-date", "conflict" or "down") from
# sync-upstream.json on the branch badges, which the script writes; "down" is written with the
# run's own token, so also when a secret is missing or the user's token has expired.
name: Sync upstream

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The run's own token writes the badge's file on the branch badges, and nothing else.
      contents: write
    env:
      PING_URL: ${{ secrets.SYNC_UPSTREAM_HEALTHCHECK_URL }}
      BADGE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge needs both branches' history back to where they parted.
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the secrets are set
        env:
          SYNC_UPSTREAM_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          missing=0
          if [ -z "$PING_URL" ]; then
            echo "::error::SYNC_UPSTREAM_HEALTHCHECK_URL is not set: nothing raises an alert when this workflow stops running"
            missing=1
          fi
          if [ -z "$SYNC_UPSTREAM_TOKEN" ]; then
            echo "::error::SYNC_UPSTREAM_TOKEN is not set: nothing can push to the fork"
            missing=1
          fi
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not set: the pull requests would have no review"
            missing=1
          fi
          exit "$missing"
      - name: Sync with upstream
        id: sync
        env:
          # The user's own token: upstream's commits may change workflow files, which GitHub lets
          # the run's token push nowhere.
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 .github/scripts/sync_upstream.py
      - name: Tell the health check it ran
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$PING_URL"
      - name: Tell the health check it failed
        if: failure() && env.PING_URL != ''
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$PING_URL/fail"
      # A run that found conflicts has written its own state; any other failure is the sync's.
      - name: Show the sync as down on the badge
        if: failure() && steps.sync.outputs.state != 'conflict'
        run: python3 .github/scripts/sync_upstream.py --badge down
